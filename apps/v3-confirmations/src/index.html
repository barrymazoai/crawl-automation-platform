<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crawler · 操作确认</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e4e9f2;background:#101521}body{max-width:900px;margin:50px auto;padding:0 24px}h1{font-size:28px}p{color:#aebbd0;line-height:1.7}article{border:1px solid #34425a;border-radius:14px;padding:22px;margin:20px 0;background:#192233}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.6}small{color:#aebbd0;overflow-wrap:anywhere}textarea{display:block;box-sizing:border-box;width:100%;min-height:80px;margin:18px 0;padding:12px;background:#101521;color:white;border:1px solid #52647e;border-radius:8px}button{padding:10px 20px;border-radius:8px;border:0;cursor:pointer;margin:8px 12px 0 0;background:#7ce0bb;color:#102e25;font-weight:600}button.reject{background:#efb3b3}button:disabled{opacity:.4;cursor:default}#status{color:#eac384}.badge{color:#7ce0bb}a{color:#8db9ff}
