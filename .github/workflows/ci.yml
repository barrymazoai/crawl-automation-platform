# Checks every push and pull request to main (docs/architecture/CODING_RULES.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: PDF engine for the PDF tests
        run: |
          python -m venv packages/v3-pdf/.venv
          packages/v3-pdf/.venv/bin/pip install -r packages/v3-pdf/python/requirements.txt

      - name: Lint and format
        run: pnpm lint

      - name: Layer boundaries
        run: pnpm check:deps

      - name: Duplicate code
        run: pnpm check:dupes

      - name: Types
        run: pnpm check:types

      - name: Unit tests
        run: pnpm test:v3

      - name: Modules load under Node (not only under vitest)
        run: pnpm smoke
